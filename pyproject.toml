[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgnl-api"
version = "0.3.0"
description = "Asynchronous python wrapper over API sgnl.pro"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Igor Gritsyuk", email = "gritsyuk.igor@gmail.com" }
]
keywords = [
    "sgnl", "api", "signal", "docs", "construction", "supervision",
    "operation", "inspections", "constarctionsite", "building management"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "httpx>=0.27.2",
    "aiofiles>=24.1.0"
]

[project.urls]
GitHub = "https://github.com/gritsyuk/sgnl-api"

[dependency-groups]
dev = [
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["sgnl_api"]
