# Publishes the sgnl-mcp image to GitHub Container Registry:
#   ghcr.io/<owner>/sgnl-mcp:<version>, :<major>.<minor> and :latest
# for linux/amd64 and linux/arm64 (Apple Silicon Macs run the arm64 image natively).
#
# Runs on a sgnl-mcp release tag (the same one that publishes to PyPI) or manually:
# Actions -> Publish Docker image -> Run workflow. The version is taken from
# mcp/pyproject.toml. Uses the repository's own GITHUB_TOKEN; no secrets to set up.
name: Publish Docker image

on:
  push:
    tags:
      - "sgnl-mcp-v*"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('mcp/pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#sgnl-mcp-v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mcp/pyproject.toml version $version"; exit 1
          fi
          echo "Building sgnl-mcp $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sgnl-mcp" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          uv sync --all-packages
          uv run --package sgnl-mcp pytest mcp/tests

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          # Otherwise the title and description would be taken from the repository (sgnl-api).
          labels: |
            org.opencontainers.image.title=sgnl-mcp
            org.opencontainers.image.description=MCP server for the SIGNAL Integration API

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
