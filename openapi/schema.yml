openapi: 3.0.4
info:
  title: SIGNAL Integration API
  description: API gateway service used for integration with the several SIGNAL modules.
  version: '1.0'
paths:
  /public/v1/acceptance-certificates/download:
    get:
      tags:
        - AcceptanceCertificate
      summary: Issues a time-limited download ticket for an acceptance certificate file.
      description: 'Required scopes: `docs:docs_transfer:read`.'
      operationId: AcceptanceCertificateDownloadV1
      parameters:
        - name: acceptanceCertificateId
          in: query
          description: Identifier of the acceptance certificate to download.
          required: true
          schema:
            type: string
            format: uuid
        - name: fileName
          in: query
          description: Optional file name hint used for the resulting download.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptanceCertificateDownloadTicket'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '404':
          description: Not Found
        '429':
          description: "Too many requests have been sent recently.\n\nYou can look at the **Retry-After** header to find out how many seconds you can repeat the request.\n\nRules for limiting requests:\n\n1) Within one **company id**, you can make a maximum of 50 requests and 4 requests will be replenished every 1 seconds, if it does not exceed the maximum.\n\n2) You can send a maximum of 10 requests per 1 second from a single **client id**.\n\n3) If the request **is not authorized**, you can make a maximum of 10 requests and 2 requests will be replenished every 2 seconds, if it does not exceed the maximum."
        '450':
          description: 'Maximum resource quota reached. To increase the quota, contact support.'
        '500':
          description: Api server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiExceptionModel'
        '550':
          description: The service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseConnectionPoolExhaustedExceptionDto'
        '401':
          description: The request did not have the correct authorization header credentials.
        '403':
          description: Forbidden
  /public/v1/acceptance-certificates/attach:
    post:
      tags:
        - AcceptanceCertificate
      summary: Attaches an acceptance certificate to a document transfer.
      description: 'Required scopes: `docs:docs_transfer:update`.'
      operationId: AcceptanceCertificateAttachV1
      requestBody:
        description: Model containing acceptance certificate properties.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AcceptanceCertificateAttach'
          text/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AcceptanceCertificateAttach'
          application/*+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AcceptanceCertificateAttach'
        required: true
      responses:
        '200':
          description: Returns the unique identifier of the attached acceptance certificate.
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          description: Bad Request
          content:
            application/json:
