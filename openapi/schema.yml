components:
  schemas:
    AcceptanceCertificate:
      required:
        - added
        - addedBy
        - companyRecipient
        - companySender
        - confirmedBySender
        - confirmedBySenderAt
        - contractNumber
        - downloadLogs
        - id
        - objectId
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the acceptance certificate.
          format: uuid
        companySender:
          minLength: 1
          type: string
          description: Sender company specified in the certificate.
        companyRecipient:
          minLength: 1
          type: string
          description: Recipient company specified in the certificate.
        addedBy:
          type: string
          description: User who created the certificate.
          format: uuid
        added:
          type: string
          description: Date and time when the certificate was created.
          format: date-time
          example: '2026-10-23T18:03:26.2726221Z'
        downloadLogs:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceCertificateDownloadLog'
          description: Logs of users who downloaded the certificate.
        contractNumber:
          type: string
          description: Associated contract number.
          nullable: true
        objectId:
          type: string
          description: Linked object identifier.
          format: uuid
          nullable: true
        confirmedBySender:
          type: string
          description: User who confirmed the certificate on sender’s side.
          format: uuid
          nullable: true
        confirmedBySenderAt:
          type: string
          description: Date and time when the sender confirmed.
          format: date-time
          nullable: true
          example: '2026-10-23T18:03:26.2726221Z'
      additionalProperties: false
    AcceptanceCertificateAttach:
      required:
        - authorId
        - companyRecipient
        - companySender
        - documentsTransferId
        - projectName
      type: object
      properties:
        documentsTransferId:
          type: string
          description: Unique identifier of the document transfer.
          format: uuid
        companySender:
          maxLength: 255
          minLength: 1
          type: string
          description: Sending organization name.
        companyRecipient:
          maxLength: 255
          minLength: 1
          type: string
          description: Recipient organization name.
        contractNumber:
          maxLength: 255
          type: string
          description: Contract number associated with the document transfer.
          nullable: true
        projectName:
          maxLength: 255
          minLength: 1
          type: string
          description: Project name specified in the certificate.
        authorId:
          type: string
          description: Unique identifier of the author on whose behalf the acceptance certificate is attached.
          format: uuid
        objectId:
          type: string
          description: Optional identifier of the uploaded acceptance certificate document object.
          format: uuid
          nullable: true
      additionalProperties: false
    AcceptanceCertificateDownloadLog:
      required:
        - downloadAt
        - downloadBy
        - downloaderIp
      type: object
      properties:
        downloadAt:
          type: string
          description: Date and time when the download occurred.
          format: date-time
          example: '2026-10-23T18:03:26.2726221Z'
        downloadBy:
          type: string
          description: User who downloaded the certificate.
          format: uuid
        downloaderIp:
          type: string
          description: IP address of the downloader.
          nullable: true
      additionalProperties: false
    AcceptanceCertificateDownloadTicket:
      required:
        - signedUrl
        - ttlSec
      type: object
      properties:
        signedUrl:
          minLength: 1
          type: string
          description: Pre-signed URL for downloading the acceptance certificate.
        ttlSec:
          type: integer
          description: Time-to-live of the download URL in seconds.
          format: int32
      additionalProperties: false
    AllowedAttributeDataType:
      enum:
        - Item
        - Folder
      type: string
    ApiExceptionModel:
      type: object
      properties:
        message:
          type: string
          nullable: true
        stackTrace:
          type: string
          nullable: true
        innerException:
          type: string
          nullable: true
        connectionId:
          type: string
          nullable: true
      additionalProperties: false
    ApplicationRole:
      enum:
        - Admin
        - User
      type: string
    ApplicationUsersDelete:
      required:
        - applicationIds
        - userIds
      type: object
      properties:
        userIds:
          maxItems: 25
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: 'Collection of user identifiers to remove (min: 1, max: 25).'
        applicationIds:
          maxItems: 10
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: 'Collection of application identifiers (min: 1, max: 10).'
      additionalProperties: false
    ApplicationUsersUpsert:
      required:
        - applicationIds
        - role
        - userIds
      type: object
      properties:
        role:
          allOf:
            - $ref: '#/components/schemas/ApplicationRole'
          description: The role to assign to the specified users within the applications.
        userIds:
          maxItems: 25
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: 'Collection of user identifiers (min: 1, max: 25).'
        applicationIds:
          maxItems: 10
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: 'Collection of application identifiers (min: 1, max: 10).'
      additionalProperties: false
