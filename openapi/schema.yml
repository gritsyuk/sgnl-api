          maxItems: 200
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
          description: Filter by slot owners.
          nullable: true
        projectIds:
          maxItems: 200
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
