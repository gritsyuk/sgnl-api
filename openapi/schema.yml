        addedTo:
          type: string
          description: Filter by creation date up to this value.
          format: date-time
          nullable: true
          example: '2026-10-23T18:03:26.2726221Z'
        modifiedFrom:
          type: string
          description: Filter by modification date starting from this value.
          format: date-time
          nullable: true
          example: '2026-10-23T18:03:26.2726221Z'
