[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgnl-mcp"
version = "0.1.0"
description = "MCP server giving an LLM agent controlled access to the SIGNAL Integration API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Igor Gritsyuk", email = "gritsyuk.igor@gmail.com" }
]
dependencies = [
    "sgnl-api>=0.4.0",
    "mcp>=2.3,<3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.2",
]

[project.scripts]
sgnl-mcp = "sgnl_mcp.server:main"

[project.urls]
GitHub = "https://github.com/gritsyuk/sgnl-api"

[tool.uv.sources]
sgnl-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["sgnl_mcp"]

[tool.hatch.build.targets.sdist]
include = ["sgnl_mcp", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
